name: CI

on:
  push:
    branches: [main, revamp]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Caches ~/.m2/repository keyed on the pom, so dependencies download once.
          cache: maven

      - name: Build and run tests
        # The suite includes an in-process Kafka broker via @EmbeddedKafka, so no service
        # containers are needed.
        run: ./mvnw -B clean verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: subscription-service-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: subscription-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
